<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0a192f;
            color: white;
        }

        h1 {
            margin-top: 30px;
            color: white;
        }

        #status {
            color: white;
        }

        .settings {
            margin: 20px;
        }

        select {
            padding: 8px 12px;
            margin: 5px;
            font-size: 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        label {
            font-weight: bold;
            margin-left: 10px;
        }

        #difficultySection {
            display: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 8px;
            justify-content: center;
            margin: 30px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #112240;
            color: white;
            border: 2px solid #233554;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }

        .cell:hover {
            background-color: #1d3557;
        }

        #restart {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #64ffda;
            color: #0a192f;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        #restart:hover {
            background-color: #52d6b8;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <!-- GAME SETTINGS -->
    <div class="settings">

        <label>Game Mode:</label>

        <select id="gameMode" onchange="changeMode()">
            <option value="twoPlayer">2 Player</option>
            <option value="computer">VS Computer</option>
        </select>


        <span id="difficultySection">

            <label>Difficulty:</label>

            <select id="difficulty" onchange="restartGame()">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

        </span>

    </div>


    <h2 id="status">Player X's Turn</h2>


    <!-- GAME BOARD -->
    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>


    <button id="restart" onclick="restartGame()">
        Restart Game
    </button>


    <script>

        let currentPlayer = "X";

        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];

        let gameOver = false;

        let computerThinking = false;


        const winningCombinations = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];



        // CHANGE GAME MODE

        function changeMode() {

            let gameMode =
                document.getElementById("gameMode").value;


            if (gameMode == "computer") {

                document.getElementById(
                    "difficultySection"
                ).style.display = "inline";

            }

            else {

                document.getElementById(
                    "difficultySection"
                ).style.display = "none";

            }


            restartGame();
        }



        // PLAYER MAKES A MOVE

        function play(index) {

            if (
                board[index] != "" ||
                gameOver == true ||
                computerThinking == true
            ) {

                return;
            }


            board[index] = currentPlayer;

            updateBoard();


            if (checkWinner(currentPlayer)) {

                document.getElementById("status").innerHTML =
                    "Player " + currentPlayer + " Wins!";

                gameOver = true;

                return;
            }


            if (checkTie()) {

                document.getElementById("status").innerHTML =
                    "It's a Tie!";

                gameOver = true;

                return;
            }


            let gameMode =
                document.getElementById("gameMode").value;


            // VS COMPUTER
            if (gameMode == "computer") {

                currentPlayer = "O";

                document.getElementById("status").innerHTML =
                    "Computer's Turn";

                computerThinking = true;


                // Small delay makes computer feel more natural
                setTimeout(function() {

                    computerMove();

                }, 500);

            }

            // TWO PLAYER MODE
            else {

                if (currentPlayer == "X") {

                    currentPlayer = "O";

                }

                else {

                    currentPlayer = "X";

                }


                document.getElementById("status").innerHTML =
                    "Player " +
                    currentPlayer +
                    "'s Turn";

            }
        }



        // COMPUTER MOVE

        function computerMove() {

            if (gameOver == true) {
                return;
            }


            let difficulty =
                document.getElementById("difficulty").value;


            let move;


            // EASY
            if (difficulty == "easy") {

                move = randomMove();

            }


            // MEDIUM
            else if (difficulty == "medium") {

                let chance = Math.random();


                // 50% chance of smart move
                if (chance < 0.5) {

                    move = bestMove();

                }

                // 50% random move
                else {

                    move = randomMove();

                }

            }


            // HARD
            else {

                move = bestMove();

            }


            board[move] = "O";

            updateBoard();


            if (checkWinner("O")) {

                document.getElementById("status").innerHTML =
                    "Computer Wins!";

                gameOver = true;
                computerThinking = false;

                return;
            }


            if (checkTie()) {

                document.getElementById("status").innerHTML =
                    "It's a Tie!";

                gameOver = true;
                computerThinking = false;

                return;
            }


            currentPlayer = "X";

            computerThinking = false;


            document.getElementById("status").innerHTML =
                "Your Turn (X)";
        }



        // EASY COMPUTER
        // PICKS RANDOM EMPTY SPACE

        function randomMove() {

            let emptySpaces = [];


            for (let i = 0; i < board.length; i++) {

                if (board[i] == "") {

                    emptySpaces.push(i);

                }
            }


            let randomNumber =
                Math.floor(
                    Math.random() * emptySpaces.length
                );


            return emptySpaces[randomNumber];
        }



        // HARD COMPUTER
        // USES MINIMAX

        function bestMove() {

            let bestScore = -Infinity;

            let move;


            for (let i = 0; i < board.length; i++) {

                if (board[i] == "") {

                    board[i] = "O";


                    let score =
                        minimax(board, false);


                    board[i] = "";


                    if (score > bestScore) {

                        bestScore = score;

                        move = i;

                    }
                }
            }


            return move;
        }



        // MINIMAX ALGORITHM

        function minimax(board, isMaximizing) {

            if (checkWinner("O")) {

                return 10;

            }


            if (checkWinner("X")) {

                return -10;

            }


            if (checkTie()) {

                return 0;

            }



            // COMPUTER'S TURN

            if (isMaximizing) {

                let bestScore = -Infinity;


                for (let i = 0; i < board.length; i++) {

                    if (board[i] == "") {

                        board[i] = "O";


                        let score =
                            minimax(board, false);


                        board[i] = "";


                        if (score > bestScore) {

                            bestScore = score;

                        }
                    }
                }


                return bestScore;

            }



            // PLAYER'S TURN

            else {

                let bestScore = Infinity;


                for (let i = 0; i < board.length; i++) {

                    if (board[i] == "") {

                        board[i] = "X";


                        let score =
                            minimax(board, true);


                        board[i] = "";


                        if (score < bestScore) {

                            bestScore = score;

                        }
                    }
                }


                return bestScore;

            }
        }



        // CHECK WINNER

        function checkWinner(player) {

            for (
                let i = 0;
                i < winningCombinations.length;
                i++
            ) {

                let a =
                    winningCombinations[i][0];

                let b =
                    winningCombinations[i][1];

                let c =
                    winningCombinations[i][2];


                if (
                    board[a] == player &&
                    board[b] == player &&
                    board[c] == player
                ) {

                    return true;

                }
            }


            return false;
        }



        // CHECK TIE

        function checkTie() {

            if (!board.includes("")) {

                return true;

            }


            return false;
        }



        // UPDATE THE SCREEN

        function updateBoard() {

            let cells =
                document.getElementsByClassName("cell");


            for (
                let i = 0;
                i < cells.length;
                i++
            ) {

                cells[i].innerHTML = board[i];

            }
        }



        // RESTART GAME

        function restartGame() {

            board = [
                "", "", "",
                "", "", "",
                "", "", ""
            ];


            currentPlayer = "X";

            gameOver = false;

            computerThinking = false;


            document.getElementById("status").innerHTML =
                "Player X's Turn";


            updateBoard();
        }

    </script>

</body>
</html>
