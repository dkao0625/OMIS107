<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            margin-top: 40px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin: 30px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border: 2px solid black;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #ddd;
        }

        #restart {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X's Turn</h2>

    <div class="board">
        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>
    </div>

    <button id="restart" onclick="restartGame()">Restart Game</button>


    <script>

        let currentPlayer = "X";

        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];

        let gameOver = false;

        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]
        ];


        function play(index) {

            if (board[index] != "" || gameOver == true) {
                return;
            }

            board[index] = currentPlayer;

            let cells = document.getElementsByClassName("cell");

            cells[index].innerHTML = currentPlayer;

            checkWinner();
        }


        function checkWinner() {

            for (let i = 0; i < winningCombinations.length; i++) {

                let a = winningCombinations[i][0];
                let b = winningCombinations[i][1];
                let c = winningCombinations[i][2];

                if (
                    board[a] != "" &&
                    board[a] == board[b] &&
                    board[b] == board[c]
                ) {
                    document.getElementById("status").innerHTML =
                        "Player " + currentPlayer + " Wins!";

                    gameOver = true;

                    return;
                }
            }


            if (!board.includes("")) {

                document.getElementById("status").innerHTML =
                    "It's a Tie!";

                gameOver = true;

                return;
            }


            if (currentPlayer == "X") {
                currentPlayer = "O";
            } else {
                currentPlayer = "X";
            }

            document.getElementById("status").innerHTML =
                "Player " + currentPlayer + "'s Turn";
        }


        function restartGame() {

            board = [
                "", "", "",
                "", "", "",
                "", "", ""
            ];

            currentPlayer = "X";
            gameOver = false;

            document.getElementById("status").innerHTML =
                "Player X's Turn";

            let cells = document.getElementsByClassName("cell");

            for (let i = 0; i < cells.length; i++) {
                cells[i].innerHTML = "";
            }
        }

    </script>

</body>
</html>
